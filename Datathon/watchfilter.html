<html>
<head>
    <title>Customize Your Experience</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        .container h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        .option-group {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 10px;
            width: 350px;
            height: 200px;
        }
        .option-group h2 {
            font-size: 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        .option-group h2 i {
            margin-right: 10px;
        }
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .button {
            background-color: #1e293b;
            border: none;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #3b82f6;
        }
        .button.selected {
            background-color: #3b82f6;
        }
        .apply-button {
            background-color: #10b981;
            border: none;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        .apply-button:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Customize Your Experience</h1>
        <div class="options">
            <div class="option-group">
                <h2><i class="fas fa-hdd"></i> Storage Options</h2>
                <div class="buttons">
                    <button class="button">64GB</button>
                    <button class="button">128GB</button>
                    <button class="button">256GB</button>
                    <button class="button">512GB</button>
                    <button class="button">1TB</button>
                </div>
            </div>
            <div class="option-group">
                <h2><i class="fas fa-dollar-sign"></i> Price Range</h2>
                <div class="buttons">
                    <button class="button">Under $300</button>
                    <button class="button">$300-$800</button>
                    <button class="button">$800-$1500</button>
                    <button class="button">$1500+</button>
                </div>
            </div>
            <div class="option-group">
                <h2><i class="fas fa-palette"></i> Color Preferences</h2>
                <div class="buttons">
                    <button class="button">Black</button>
                    <button class="button">Silver</button>
                    <button class="button">Gold</button>
                    <button class="button">Blue</button>
                    <button class="button">White</button>
                </div>
            </div>
            <div class="option-group">
                <h2><i class="fas fa-crown"></i> Brand Selection</h2>
                <div class="buttons">
                    <button class="button">Apple</button>
                    <button class="button">Sony</button>
                    <button class="button">Samsung</button>
                    <button class="button">Dell</button>
                    <button class="button">Asus</button>
                </div>
            </div>
        </div>
        <button class="apply-button">Apply Settings</button>
    </div>
    <script>
        document.querySelectorAll('.button').forEach(button => {
            button.addEventListener('click', () => {
                button.classList.toggle('selected');
            });
        });
    </script>
</body>
</html>
