<html>
<head>
    <title>Discover Premium Electronics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #0f0f2d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 800px;
            padding: 20px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #a0a0b2;
            margin-bottom: 30px;
        }
        .categories {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .category {
            background-color: #1a1a3d;
            padding: 20px;
            border-radius: 10px;
            width: 150px;
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s;
            cursor: pointer;
        }
        .category:hover {
            background-color: #2a2a5d;
        }
        .category i {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .category span {
            font-size: 14px;
        }
        .category.active {
            background-color: #00ff6a;
            color: #0f0f2d;
        }
        .explore-btn {
            background-color: #00ff6a;
            color: #0f0f2d;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .explore-btn:hover {
            background-color: #00cc55;
        }
        @media (max-width: 600px) {
            .category {
                width: 100px;
                height: 80px;
            }
            .category i {
                font-size: 20px;
            }
            .category span {
                font-size: 12px;
            }
            .explore-btn {
                font-size: 14px;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>
    <a href="recommendation.html" style="color: white;"><i class="fas fa-arrow-left">Back
    </i></a>
    <div class="container">
        <h1>Discover Premium Electronics</h1>
        <p>Select one or more categories based on your technology needs</p>
        <div class="categories">
            <div class="category" onclick="toggleActive(this)">
                <i class="fas fa-mobile-alt"></i>
                <span>Smartphones</span>
            </div>
            <div class="category" onclick="toggleActive(this)">
                <i class="fas fa-laptop"></i>
                <span>Laptops</span>
            </div>
            <div class="category" onclick="toggleActive(this)">
                <i class="fas fa-tablet-alt"></i>
                <span>Tablets</span>
            </div>
            <div class="category" onclick="toggleActive(this)">
                <i class="fas fa-headphones-alt"></i>
                <span>Accessories</span>
            </div>
            <div class="category" onclick="toggleActive(this)">
                <i class="fas fa-camera"></i>
                <span>Cameras</span>
            </div>
        </div>
        <button class="explore-btn"><a href="techavailable.html">Explore Now</a></button>
    </div>
    <script>
        function toggleActive(element) {
            element.classList.toggle('active');
        }
    </script>
</body>
</html>
